  <!-- Critical loader CSS: inline so the first paint is never blank -->
  <style>
    html.is-loading body { overflow: hidden; }
    .loader {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-content: center; justify-items: center; gap: 18px;
      background: color-mix(in srgb, #F3EDE1 72%, transparent);
      color: #1E1A16; transition: opacity .45s ease, visibility .45s;
      animation: loader-failsafe .3s 8.5s forwards; /* even with no JS, never hangs */
      cursor: progress;
    }
    html.is-loaded .loader { opacity: 0; visibility: hidden; pointer-events: none; }
    @keyframes loader-failsafe { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    .loader .hw { display: inline-block; position: relative; height: 1em; aspect-ratio: var(--ar); }
    .loader .hw::before, .loader .hw::after {
      content: ""; position: absolute; inset: 0; background: currentColor;
      -webkit-mask: var(--a) center / contain no-repeat; mask: var(--a) center / contain no-repeat;
    }
    .loader .hw::after { -webkit-mask-image: var(--b); mask-image: var(--b); opacity: 0; }
    /* the figure alternates still/walk poses only while he's actually walking */
    .loader .ld-fig.walking::before { animation: ld-a .286s steps(1,end) infinite; }
    .loader .ld-fig.walking::after  { animation: ld-b .286s steps(1,end) infinite; }
    @keyframes ld-a { 0% { opacity: 1 } 50% { opacity: 0 } }
    @keyframes ld-b { 0% { opacity: 0 } 50% { opacity: 1 } }
    .ld-count { font-size: clamp(56px, 12vw, 96px); height: 1em; display: flex; gap: .04em; align-items: flex-end; }
    .ld-count .ld-dpct { height: .62em; margin-left: .06em; }
    .ld-track { position: relative; width: min(320px, calc(100vw - 48px)); height: 84px; }
    .ld-track > .hw { position: absolute; }
    .ld-strip  { left: 0; bottom: 14px; font-size: 30px; }
    .ld-socket { right: 0; bottom: 14px; font-size: 54px; }
    .ld-fig    { left: 0; bottom: 6px; font-size: 64px; will-change: transform; }
    .ld-plug   { left: 0; bottom: 30px; font-size: 18px; will-change: transform; }
    .ld-spark  { right: 18px; bottom: 50px; font-size: 34px; opacity: 0; color: #E8602C; }
    .is-plugged .ld-spark { opacity: 1; transform: scale(1.15); transition: opacity .08s, transform .3s; }
    .ld-cable  { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .ld-cable path { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
    .ld-line { margin: 0; font: 500 .9rem/1.4 system-ui, sans-serif; color: #5A5047; max-width: 30ch; text-align: center; }
    @media (prefers-reduced-motion: reduce) {
      .loader .ld-fig::before, .loader .ld-fig::after { animation: none !important; }
      .loader { transition: none; }
    }
  </style>

      <span class="hw pill-icon" data-hw="icon-notebook" aria-hidden="true"></span>
      <span class="hw pill-word" data-hw="about" aria-hidden="true"></span><span class="sr-only">About</span></a></li>
    <li><a class="pill" href="#about/hobbies" data-panel="about" data-page="hobbies" style="--hover: var(--sticky)" data-rough="999">
      <span class="hw pill-icon" data-hw="icon-spark" aria-hidden="true"></span>
      <span class="hw pill-word" data-hw="hobbies" aria-hidden="true"></span><span class="sr-only">Hobbies</span></a></li>
    <li><a class="pill" href="#contact" data-panel="contact" style="--hover: var(--signal); --hover-ink: var(--paper)" data-rough="999">
      <span class="hw pill-icon" data-hw="icon-hand" aria-hidden="true"></span>
      <span class="hw pill-word" data-hw="contact" aria-hidden="true"></span><span class="sr-only">Contact</span></a></li>
    <li><a class="pill" href="/support.html" style="--hover: var(--copper); --hover-ink: var(--paper)" data-rough="999">
      <span class="hw pill-icon" data-hw="icon-dollar" aria-hidden="true"></span>
      <span class="hw pill-word" data-hw="support" aria-hidden="true"></span><span class="sr-only">Support</span></a></li>
  </ul>
</nav>

<main id="desk" class="desk">
  <h1 class="desk-hello" data-reveal data-solid>
    <span class="hw" data-hw="hey-im-nash" aria-hidden="true"></span>
    <span class="sr-only">Hey, I'm Nash. I create, wonder, and rebuild.</span>
  </h1>
  <div class="desk-face" data-face data-reveal aria-label="Nash’s face"></div>
  <div id="table" class="table" aria-hidden="true"></div>
  <p class="hero-line" data-reveal data-solid aria-hidden="true">
    <span class="hw hero-i" data-hw="i"></span>
    <span class="hero-verbs">
      <span class="hw hero-verb is-on" data-hw="create"></span>
      <span class="hw hero-verb" data-hw="wonder"></span>
      <span class="hw hero-verb" data-hw="rebuild"></span>
    </span>
  </p>
  <span class="hw hero-hint jitter" data-hw="arrow-down" aria-hidden="true"></span>
</main>
<div id="scroll-space" class="scroll-space" aria-hidden="true"></div>

<!-- Panels: overlays driven by js/state.js -->
<section class="panel panel-work" data-panel="work" role="dialog" aria-modal="true" aria-labelledby="p-work" hidden>
  <h2 id="p-work" tabindex="-1"><span class="hw" data-hw="work-caps" aria-hidden="true"></span><span class="sr-only">Work</span></h2>
  <div class="work-cards"></div>
  <nav class="work-pager" aria-label="Project pages">
    <button type="button" class="work-prev"><span class="hw" data-hw="prev-cap" aria-hidden="true"></span><span class="sr-only">Previous projects</span></button>
    <div class="work-marks"></div>
    <button type="button" class="work-next"><span class="hw" data-hw="next-cap" aria-hidden="true"></span><span class="sr-only">Next projects</span></button>
  </nav>
</section>

<section class="panel panel-about" data-panel="about" role="dialog" aria-modal="true" aria-labelledby="p-about" hidden>
  <div class="notebook" data-solid>
    <div class="nb-tabs" role="tablist" aria-label="Notebook pages">
      <button type="button" class="nb-tab" role="tab" data-tab="notes" aria-selected="true"><span class="hw" data-hw="lab-notes" aria-hidden="true"></span><span class="sr-only">Lab notes</span></button>
      <button type="button" class="nb-tab" role="tab" data-tab="hobbies" aria-selected="false"><span class="hw" data-hw="hobbies-notebook" aria-hidden="true"></span><span class="sr-only">Hobbies</span></button>
    </div>
    <article class="nb-page" data-page="notes" role="tabpanel">
      <h2 id="p-about" tabindex="-1"><span class="hw" data-hw="lab-notes" aria-hidden="true"></span><span class="sr-only">Lab notes</span></h2>
      <div class="nb-body"></div>
      <span class="hw nb-sig" data-hw="signature-full" aria-hidden="true"></span>
    </article>
    <article class="nb-page" data-page="hobbies" role="tabpanel" hidden>
      <h2 tabindex="-1"><span class="hw" data-hw="hobbies-notebook" aria-hidden="true"></span><span class="sr-only">Hobbies</span></h2>
      <div class="nb-body"></div>
    </article>
  </div>
</section>

<section class="panel panel-contact" data-panel="contact" role="dialog" aria-modal="true" aria-labelledby="p-contact" hidden>
  <h2 id="p-contact" tabindex="-1"><span class="hw" data-hw="contact-panel" aria-hidden="true"></span><span class="sr-only">Contact</span></h2>
  <div class="pager-stage">
    <img class="pager-img" src="/img/desk/pager.TODO.svg" alt="" aria-hidden="true">
    <form class="pager-form" novalidate data-solid>
      <p class="screen-line" aria-hidden="true">&gt; NEW MSG<span class="caret">_</span></p>
      <div class="field" data-field="name">
        <label for="c-name">name</label>
        <input id="c-name" name="name" autocomplete="name" maxlength="100" required aria-describedby="c-name-err">
        <span class="field-err" id="c-name-err"></span>
      </div>
      <div class="field" data-field="email">
        <label for="c-email">email</label>
        <input id="c-email" name="email" type="email" autocomplete="email" maxlength="200" required aria-describedby="c-email-err">
        <span class="field-err" id="c-email-err"></span>
      </div>
      <fieldset class="field" data-field="budget">
        <legend><span class="hw" data-hw="budget" aria-hidden="true"></span><span class="sr-only">Budget</span></legend>
        <div class="budget-pills"></div>
        <span class="field-err"></span>
      </fieldset>
      <div class="field" data-field="message">
        <label for="c-msg">message</label>
        <textarea id="c-msg" name="message" rows="5" maxlength="4000" required aria-describedby="c-msg-err"></textarea>
        <span class="field-err" id="c-msg-err"></span>
      </div>
      <div class="hp" aria-hidden="true"><label for="c-web">website</label><input id="c-web" name="website" tabindex="-1" autocomplete="off"></div>
      <div class="ts-box"></div>
      <button type="submit" class="send" data-rough="999"><span class="hw" data-hw="send" aria-hidden="true"></span><span class="sr-only">Send</span></button>
      <p class="form-status" role="status" aria-live="polite"></p>
      <span class="hw sent-mark" data-hw="sent" aria-hidden="true"></span>
    </form>
  </div>
</section>

<section class="panel" data-panel="terminal" role="dialog" aria-modal="true" aria-labelledby="p-term" hidden>
  <h2 id="p-term" tabindex="-1">terminal</h2>
  <p>The CRT terminal lands here in stage 4.</p>
</section>

<script src="/js/loader.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
