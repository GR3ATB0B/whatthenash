# Cloudflare Worker for the whatthenash.com contact form.
# Deploy:   cd worker && npx wrangler deploy
# Secrets (never commit these):
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put CONTACT_TO
name = "whatthenash-contact"
main = "src/index.js"
compatibility_date = "2026-10-01"

# TODO(Nash): add a route once api.whatthenash.com points at Cloudflare
# routes = [{ pattern = "api.whatthenash.com/contact", zone_name = "whatthenash.com" }]

[vars]
ALLOWED_ORIGINS = "https://whatthenash.com,https://www.whatthenash.com"
CONTACT_FROM = "whatthenash.com <contact@whatthenash.com>"   # domain must be verified in Resend

[[ratelimits]]
name = "CONTACT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
